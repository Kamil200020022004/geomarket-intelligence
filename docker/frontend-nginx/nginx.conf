# Serwer plików statycznych frontendu (aplikacja jednostronicowa React Router).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ścieżki aplikacji (np. /reset-password, /gielda) obsługuje React Router — zwracamy index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pliki z hashem w nazwie (assets/*) można długo trzymać w cache przeglądarki.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
