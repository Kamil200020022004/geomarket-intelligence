# Docker Compose platformy GeoMarket Intelligence (autor: Sebastian Michulec).
#
# Cała platforma jednym poleceniem (z katalogu głównego repozytorium, wymaga pliku .env — wzór w .env.example;
# klucze serwisu AI w backend-ai/.env):
#   docker compose up -d --build
#
# Tylko infrastruktura (np. gdy backend uruchamiasz lokalnie z Pythona):
#   docker compose up -d mysql kafka kafka-ui
#
# Adresy: frontend http://localhost:5173, API http://localhost:8000/docs, Kafka UI http://localhost:8090
name: geomarket

# Wspólne ustawienia kontenerów z obrazu backendu: adresy usług w sieci Compose zamiast localhost.
x-backend: &backend
  build:
    context: ./backend
  image: geomarket-backend
  env_file: .env
  environment:
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    AI_SERVICE_URL: http://backend-ai:8001
    LAKEHOUSE_ROOT: /data/lakehouse
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- infrastruktura
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ustaw MYSQL_ROOT_PASSWORD w pliku .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geomarket}
      MYSQL_USER: ${MYSQL_USER:-geomarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ustaw MYSQL_PASSWORD w pliku .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Skrypty wykonywane tylko przy pierwszym utworzeniu bazy (np. baza testowa).
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Broker Kafki w trybie KRaft: jeden węzeł pełni rolę brokera i kontrolera (bez ZooKeepera).
  # Dwa nasłuchy: PLAINTEXT kafka:29092 dla kontenerów w sieci Compose,
  # EXTERNAL localhost:9092 dla procesów uruchomionych na komputerze (producent, konsument, testy).
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Jeden broker = replikacja 1 (w produkcji co najmniej 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tematy tworzy aplikacja z jawną konfiguracją (app/stream/topics.py), nie automatycznie.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Podgląd tematów, partycji, wiadomości i opóźnienia konsumentów: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: geomarket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- backend Sebastiana
  # Migracje schematu MySQL — jednorazowo przed startem API.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  # Bramka API (port 8000). --proxy-headers: za reverse proxy (np. nginx z SSL na VPS) adres klienta
  # pochodzi z nagłówka X-Forwarded-For — ważne dla limitów zapytań per IP.
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - lakehouse:/data/lakehouse
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Potok strumieniowy: Kafka → Delta Lake (Bronze/Silver/Gold).
  consumer:
    <<: *backend
    command: ["python", "-m", "app.stream.consumer"]
    volumes:
      - lakehouse:/data/lakehouse
    depends_on:
      kafka:
        condition: service_healthy

  # Potok strumieniowy: Yahoo Finance i CoinGecko → Kafka.
  producer:
    <<: *backend
    command: ["python", "-m", "app.stream.producer"]
    depends_on:
      kafka:
        condition: service_healthy

  # Jednorazowe załadowanie historii (60 dni świec godzinowych) przy każdym `up`.
  # Bezpieczne do powtarzania: zapis w Lakehouse jest idempotentny.
  backfill:
    <<: *backend
    command: ["python", "-m", "app.stream.backfill"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- serwis AI Patryka
  # Dostępny tylko z tego komputera (127.0.0.1) — przeglądarka łączy się wyłącznie z bramką (port 8000).
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: ../docker/backend-ai.Dockerfile
    image: geomarket-backend-ai
    restart: unless-stopped
    env_file:
      - path: backend-ai/.env
        required: false
    environment:
      LAKEHOUSE_ROOT: /data/lakehouse
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    volumes:
      - lakehouse:/data/lakehouse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- frontend Kamila
  # Pliki statyczne z nginx. Adres API jest wpisywany w czasie budowania (przeglądarka łączy się z localhost:8000).
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      additional_contexts:
        frontend-nginx: ./docker/frontend-nginx
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_MARKET_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_FAVORITES_PROVIDER: api
    image: geomarket-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  kafka_data:
  # Wspólny Lakehouse: konsument i serwis AI piszą, API i serwis AI czytają.
  lakehouse:
